<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://enzoschitini.github.io/better-ai/pt/">
<title>BetterAI Docs</title>
<script>
  (function () {
    var langs = ['pt', 'en', 'it'];
    var pick = null;
    try { pick = localStorage.getItem('betterai-docs-lang'); } catch (e) {}
    if (langs.indexOf(pick) < 0) {
      var prefs = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < prefs.length && !pick; i++) {
        var two = String(prefs[i]).slice(0, 2).toLowerCase();
        if (langs.indexOf(two) >= 0) pick = two;
      }
    }
    location.replace((pick || 'pt') + '/');
  })();
</script>
<meta http-equiv="refresh" content="0;url=pt/">
</head>
<body>
  <p>Abrindo a documentação...</p>
  <ul>
    <li><a href="pt/">pt-BR</a></li>
    <li><a href="en/">en</a></li>
    <li><a href="it/">it</a></li>
  </ul>
</body>
</html>
